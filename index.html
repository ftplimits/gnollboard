    // ═══════════════════════════════════════════════════════════════════════════
    // PAN / ZOOM / TRANSFORM
    // ═══════════════════════════════════════════════════════════════════════════
    function updateTransform() {
        const gridSize = 8000, margin = 100; // 8000 > actual 5000 grid — loose clamping near edges
        const scaledSize = gridSize * zoom;
        const minPanX = -scaledSize + window.innerWidth  - margin;
        const minPanY = -scaledSize + window.innerHeight - margin;
        // Only clamp if the virtual size is larger than the viewport
        if (scaledSize > window.innerWidth)  panX = Math.max(minPanX, Math.min(margin, panX));
        if (scaledSize > window.innerHeight) panY = Math.max(minPanY, Math.min(margin, panY));
        gridContainer.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
        if (selectedObject) updateSelectionOverlay();
    }

    function zoomIn(cx, cy) {
        const oz = zoom; zoom = Math.min(zoom * 1.2, 4);
        if (cx !== undefined) { const gx = (cx-panX)/oz, gy = (cy-panY)/oz; panX = cx-gx*zoom; panY = cy-gy*zoom; }
        updateTransform();
    }
    function zoomOut(cx, cy) {
        const oz = zoom; zoom = Math.max(zoom / 1.2, 0.25);
        if (cx !== undefined) { const gx = (cx-panX)/oz, gy = (cy-panY)/oz; panX = cx-gx*zoom; panY = cy-gy*zoom; }
        updateTransform();
    }

    let rightDownX = 0, rightDownY = 0, rightMoved = false;

    viewport.addEventListener('wheel', e => { e.preventDefault(); e.deltaY < 0 ? zoomIn(e.clientX,e.clientY) : zoomOut(e.clientX,e.clientY); }, { passive: false });
    viewport.addEventListener('mousedown', e => {
        if (e.button === 2) {
            e.preventDefault();
            rightDownX = e.clientX; rightDownY = e.clientY; rightMoved = false;
            // Always start pan immediately — we'll decide on mouseup whether to clear tool
            isPanning = true; panStartX = e.clientX - panX; panStartY = e.clientY - panY; viewport.style.cursor = 'grabbing';
        }
    });
    viewport.addEventListener('mousemove', e => {
        if (isPanning) { panX = e.clientX-panStartX; panY = e.clientY-panStartY; updateTransform(); }
        if (e.buttons === 2) {
            const d = Math.hypot(e.clientX - rightDownX, e.clientY - rightDownY);
            if (d > 6) rightMoved = true;
        }
    });
    viewport.addEventListener('mouseup', e => {
        if (e.button !== 2) return;
        isPanning = false; viewport.style.cursor = 'default';
        if (rightMoved) return;

        // Door right-click: exit tool or show delete popup
        if (doorMode) {
            const pos = viewportToGrid(e.clientX, e.clientY);
            const hit = doors.find(d => ptSegDist(pos.x, pos.y, d.p1.x, d.p1.y, d.p2.x, d.p2.y) < 15);
            if (hit) {
                showDoorDeleteMenu(e.clientX, e.clientY, hit);
            } else {
                // Right-click with no door nearby — cancel placement and exit door mode
                doorMode = false; doorP1 = null;
                document.getElementById('btn-fog-door')?.classList.remove('active');
                viewport.style.cursor = 'default';
                drawPresetOutlines();
            }
            return;
        }

        // Right-click near a door in normal mode — show delete popup
        if (isHost && !rightMoved) {
            const pos = viewportToGrid(e.clientX, e.clientY);
            const hit = doors.find(d => ptSegDist(pos.x, pos.y, d.p1.x, d.p1.y, d.p2.x, d.p2.y) < 15);
            if (hit) { showDoorDeleteMenu(e.clientX, e.clientY, hit); return; }
        }

        // Clear multi-select group first if any
        if (multiSelected.length) {
            multiSelected.forEach(m => m.div.classList.remove('multi-selected'));
            multiSelected = [];
            return;
        }
        // In-place right click — clear tools in priority order
        deselectObject();
        if (fogPolyMode && fogPolyVerts.length > 0) {
            fogPolyVerts = []; fogPolyMousePos = null;
            fogPolyCtx.clearRect(0, 0, fogPolyCanvas.width, fogPolyCanvas.height);
            return;
        }
        if (fogPolyMode) { startFogPoly(fogPolyMode); return; }
        if (fogPresetMode) { startFogPresetMode(fogPresetMode); return; }
        if (currentFogTool) { setFogTool(null); return; }
        if (currentTool) { clearTool(); }
    });

    document.addEventListener('contextmenu', e => {
        if (e.target.closest('#vtt-logo')) return;
        if (e.target.closest('#dice-column')) return; // let dice handle their own menus
        e.preventDefault();
    });

    // ═══════════════════════════════════════════════════════════════════════════
    // PING SYSTEM
    // ═══════════════════════════════════════════════════════════════════════════
    const pingCanvas = document.getElementById('ping-canvas');
    const pingCtx    = pingCanvas.getContext('2d');
    let activePings  = [];

    function triggerPingLocal(x, y, color) {
        activePings.push({ x, y, startTime: performance.now(), color: color || '#cc0000' });
        if (activePings.length === 1) requestAnimationFrame(animatePings);
    }

    function triggerPing(x, y) {
        triggerPingLocal(x, y, myColor || '#cc0000');
        broadcast({ type: 'ping', x, y, color: myColor || '#cc0000' });
    }

    function animatePings(now) {
        pingCtx.clearRect(0, 0, pingCanvas.width, pingCanvas.height);
        const dur = 1200;
        activePings = activePings.filter(p => now - p.startTime < dur);
        for (const p of activePings) {
            const t    = Math.max(0, (now - p.startTime) / dur);
            const ease = 1 - Math.pow(1-t, 3);
            const maxR = 60;
            const c    = p.color || '#cc0000';
            // Parse hex to rgb for rgba()
            const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
            pingCtx.beginPath(); pingCtx.arc(p.x, p.y, ease*maxR, 0, Math.PI*2);
            pingCtx.strokeStyle = `rgba(${r},${g},${b},${1-t})`; pingCtx.lineWidth = 3; pingCtx.stroke();
            if (t > 0.15) {
                const t2 = (t-0.15)/0.85;
                pingCtx.beginPath(); pingCtx.arc(p.x, p.y, t2*maxR*0.65, 0, Math.PI*2);
                pingCtx.strokeStyle = `rgba(${r},${g},${b},${1-t2})`; pingCtx.lineWidth = 2; pingCtx.stroke();
            }
            if (t < 0.4) {
                pingCtx.beginPath(); pingCtx.arc(p.x, p.y, 5, 0, Math.PI*2);
                pingCtx.fillStyle = `rgba(${r},${g},${b},${1-t/0.4})`; pingCtx.fill();
            }
        }
        if (activePings.length > 0) requestAnimationFrame(animatePings);
    }

    viewport.addEventListener('mousedown', e => {
        if (e.button === 1) { e.preventDefault(); const pos = viewportToGrid(e.clientX,e.clientY); triggerPing(pos.x,pos.y); }
        if (e.button === 0 && e.altKey) { e.preventDefault(); e.stopPropagation(); const pos = viewportToGrid(e.clientX,e.clientY); triggerPing(pos.x,pos.y); }
    });
    viewport.addEventListener('auxclick', e => { if (e.button===1) e.preventDefault(); });

    // Right-click clears fog tool and deactivates measure
    viewport.addEventListener('contextmenu', e => {
        if (currentFogTool) { setFogTool(null); e.preventDefault(); }
        if (measureActive)  { measureActive = false; clearMeasure(); document.getElementById('measure-toggle').classList.remove('active'); e.preventDefault(); }
    });

    // Left-click on empty viewport (no tool, no fog, no measure drag) deselects everything
    viewport.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        if (currentTool || currentFogTool || selectedIconUrl || measureActive) return;
        // Only deselect if the click target is the viewport or grid background itself
        if (e.target === viewport || e.target === document.getElementById('grid-background') ||
            e.target === document.getElementById('grid-container') || e.target.id === 'drawing-canvas') {
            deselectObject();
        }
    });

    // ═══════════════════════════════════════════════════════════════════════════
    // FOG OF WAR SYSTEM
    // ═══════════════════════════════════════════════════════════════════════════
    const fogCanvas = document.getElementById('fog-canvas');
    const fogCtx    = fogCanvas.getContext('2d');
    const CELL      = 50;   // must match grid tile size exactly
    const FOG_OFFSET = 8;   // matches grid-background border width so cells align
    let fogCells    = new Set();
    let currentFogTool = null;
    let isFogPainting  = false;

    function drawFogCell(cx, cy) {
        fogCtx.fillStyle = isHost ? 'rgba(0,0,0,0.5)' : '#000000';
        fogCtx.fillRect(cx * CELL + FOG_OFFSET, cy * CELL + FOG_OFFSET, CELL, CELL);
    }

    function eraseFogCell(cx, cy) {
        fogCtx.clearRect(cx * CELL + FOG_OFFSET, cy * CELL + FOG_OFFSET, CELL, CELL);
    }

    // Redraws entire fog canvas with atmospheric radial gradient overlay.
    // Called on mouseup (not during drag) for performance.
    // Persistent offscreen fog buffer — avoids blank-flash on redraw (fix 1)
    const fogBuffer    = document.createElement('canvas');
    fogBuffer.width    = 5000; fogBuffer.height = 5000;
    const fogBufferCtx = fogBuffer.getContext('2d');

    function redrawFog(dirtyTokenId = null) {
        invalidateLitCache(); // new render cycle — recompute lit cells fresh
        // Draw entirely into the buffer first, then blit — never clears the visible canvas mid-frame
        fogBufferCtx.clearRect(0, 0, fogBuffer.width, fogBuffer.height);

        const baseAlpha = isHost ? 0.5 : 1.0;

        fogBufferCtx.fillStyle = `rgba(0,0,0,${baseAlpha})`;
        fogCells.forEach(key => {
            const [cx, cy] = key.split(',').map(Number);
            fogBufferCtx.fillRect(cx * CELL + FOG_OFFSET, cy * CELL + FOG_OFFSET, CELL, CELL);
        });

        fogPresets.forEach(p => {
            if (!p.fogged || p.verts.length < 3) return;
            fogBufferCtx.fillStyle = `rgba(0,0,0,${baseAlpha})`;
            fogBufferCtx.beginPath();
            fogBufferCtx.moveTo(p.verts[0].x, p.verts[0].y);
            p.verts.forEach(v => fogBufferCtx.lineTo(v.x, v.y));
            fogBufferCtx.closePath();
            fogBufferCtx.fill();
        });

        if (!fogCells.size && !fogPresets.some(p => p.fogged)) {
            fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
            return;
        }

        // Radial gradient overlay
        const cx = fogBuffer.width  / 2;
        const cy = fogBuffer.height / 2;
        const r  = Math.max(fogBuffer.width, fogBuffer.height) * 0.65;
        const grad = fogBufferCtx.createRadialGradient(cx, cy, 0, cx, cy, r);
        if (isHost) {
            grad.addColorStop(0,   'rgba(20,20,20,0)');
            grad.addColorStop(0.5, 'rgba(10,10,10,0.1)');
            grad.addColorStop(1,   'rgba(0,0,0,0.2)');
        } else {
            grad.addColorStop(0,   '#1a1a1a');
            grad.addColorStop(0.5, '#0d0d0d');
            grad.addColorStop(1,   '#000000');
        }
        fogBufferCtx.globalCompositeOperation = 'source-atop';
        fogBufferCtx.fillStyle = grad;
        fogBufferCtx.fillRect(0, 0, fogBuffer.width, fogBuffer.height);
        fogBufferCtx.globalCompositeOperation = 'source-over';

        // Cut light radius areas out of buffer (fix 4: per-token when possible)
        redrawLightFogCuts(dirtyTokenId);

        // Atomic blit — visible canvas updates in one operation, no flash
        fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
        fogCtx.drawImage(fogBuffer, 0, 0);
    }

    function applyFogBrush(gridX, gridY, painting) {
        const centerCX = Math.floor(gridX / CELL);
        const centerCY = Math.floor(gridY / CELL);
        const changed = [];
        for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
                const cx = centerCX + dx, cy = centerCY + dy;
                if (cx < 0 || cy < 0 || cx >= 100 || cy >= 100) continue;
                const key = `${cx},${cy}`;
                if (painting) {
                    if (!fogCells.has(key)) { fogCells.add(key); drawFogCell(cx, cy); changed.push({ cx, cy, fog: true }); }
                } else {
                    if (fogCells.has(key)) { fogCells.delete(key); eraseFogCell(cx, cy); changed.push({ cx, cy, fog: false }); }
                }
            }
        }
        if (changed.length) broadcast({ type: 'fog_cells', cells: changed });
    }

    function fogConfirm(message, onConfirm) {
        const overlay = document.createElement('div');
        overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;`;
        const box = document.createElement('div');
        box.style.cssText = `background:#1e1e1e;border:2px solid rgba(255,255,255,0.15);border-radius:10px;padding:20px 24px;font-family:var(--font-serif);color:#ddd;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.5);`;
        box.innerHTML = `<div style="font-size:15px;margin-bottom:16px;">${message}</div>`;
        const row = document.createElement('div');
        row.style.cssText = `display:flex;gap:10px;justify-content:center;`;
        const yes = document.createElement('button');
        yes.textContent = 'Yes'; yes.style.cssText = `padding:6px 20px;background:#8b4513;color:white;border:none;border-radius:5px;font-family:var(--font-serif);font-size:14px;cursor:pointer;`;
        const no  = document.createElement('button');
        no.textContent  = 'Cancel'; no.style.cssText = `padding:6px 20px;background:#333;color:#aaa;border:none;border-radius:5px;font-family:var(--font-serif);font-size:14px;cursor:pointer;`;
        yes.onclick = () => { overlay.remove(); onConfirm(); };
        no.onclick  = () => overlay.remove();
        row.appendChild(yes); row.appendChild(no);
        box.appendChild(row); overlay.appendChild(box); document.body.appendChild(overlay);
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    }

    function fillFog() {
        fogConfirm('Cover the entire map in fog?', () => {
            fogCells.clear();
            for (let cx = 0; cx < 100; cx++)
                for (let cy = 0; cy < 100; cy++)
                    fogCells.add(`${cx},${cy}`);
            redrawFog();
            broadcast({ type: 'fog_fill' });
        });
    }

    function clearAllFog() {
        fogConfirm('Clear all fog from the map?', () => {
            fogCells.clear();
            fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
            broadcast({ type: 'fog_clear' });
        });
    }

    function clearAllFog() {
        fogConfirm('Clear all fog from the map?', () => {
            fogCells.clear();
            fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
            broadcast({ type: 'fog_clear' });
        });
    }

    // ── Polygon fog ──────────────────────────────────────────────────────────
    const lightCanvas = document.getElementById('light-canvas');
    const lightCtx    = lightCanvas.getContext('2d');

    function redrawLights() {
        // Light canvas no longer used for glow — just clear it
        lightCtx.clearRect(0, 0, lightCanvas.width, lightCanvas.height);
    }

    // ── Visibility polygon (line-of-sight within a polygon) ──────────────────
    // ── Grid-space ray-march light system ───────────────────────────────────
    // Casts rays from each lit token, steps cell-by-cell, stops at polygon edges.
    // Result: Set of "cx,cy" strings — cells cleared from the fog buffer.
    // No offscreen canvases, no compositing, no visibility polygon computation.

    function segsIntersect(ax,ay,bx,by,cx,cy,dx,dy) {
        const d = (bx-ax)*(dy-cy)-(by-ay)*(dx-cx);
        if (Math.abs(d)<1e-9) return false;
        const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d;
        const u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d;
        return t>0.01&&t<1.01&&u>=-0.01&&u<=1.01;
    }

    // Returns the intersection point (or null) between two segments
    function segIntersectPt(ax,ay,bx,by,cx,cy,dx,dy) {
        const d = (bx-ax)*(dy-cy)-(by-ay)*(dx-cx);
        if (Math.abs(d)<1e-9) return null;
        const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d;
        const u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d;
        if(t>0.01&&t<1.01&&u>=-0.01&&u<=1.01)
            return { x: ax+t*(bx-ax), y: ay+t*(by-ay) };
        return null;
    }

    // Cache for computeLitCells — invalidated at start of each redrawFog/redrawDoors cycle
    let litCellsCache = null;

    function computeLitCells() {
        if (litCellsCache) return litCellsCache;
        const litCells = new Set();
        if (!tokens.some(t=>t.lightRadius>0)) { litCellsCache = litCells; return litCells; }

        const allEdges=[];
        fogPresets.forEach(p=>{
            if(!p.fogged||p.verts.length<3) return;
            for(let i=0;i<p.verts.length;i++){
                const j=(i+1)%p.verts.length;
                allEdges.push({ax:p.verts[i].x,ay:p.verts[i].y,bx:p.verts[j].x,by:p.verts[j].y,polyId:p.id});
            }
        });
        doors.forEach(d=>{
            if(!d.open) allEdges.push({ax:d.p1.x,ay:d.p1.y,bx:d.p2.x,by:d.p2.y,polyId:-1});
        });

        tokens.forEach(t=>{
            if(!t.lightRadius||t.lightRadius<=0) return;
            const tx=t.x+FOG_OFFSET, ty=t.y+FOG_OFFSET;
            const r=t.lightRadius;
            const blocking = allEdges;
            const numRays=Math.max(24,r*12);
            const tcx = Math.floor((tx-FOG_OFFSET)/CELL);
            const tcy = Math.floor((ty-FOG_OFFSET)/CELL);
            if(tcx>=0&&tcy>=0&&tcx<100&&tcy<100) litCells.add(`${tcx},${tcy}`);
            for(let i=0;i<numRays;i++){
                const angle=(i/numRays)*Math.PI*2;
                const dx=Math.cos(angle),dy=Math.sin(angle);
                let px=tx,py=ty;
                for(let step=1;step<=r;step++){
                    const x=tx+dx*step*CELL, y=ty+dy*step*CELL;
                    const cx=Math.floor((x-FOG_OFFSET)/CELL);
                    const cy=Math.floor((y-FOG_OFFSET)/CELL);
                    if(cx<0||cy<0||cx>=100||cy>=100) break;
                    let blocked=false;
                    for(const e of blocking){
                        const pt = segIntersectPt(px,py,x,y,e.ax,e.ay,e.bx,e.by);
                        if(!pt) continue;
                        const throughDoor = doors.some(d => {
                            if (!d.open) return false;
                            const ddx = d.p2.x-d.p1.x, ddy = d.p2.y-d.p1.y;
                            const dlen = Math.hypot(ddx, ddy);
                            if (dlen < 1) return false;
                            const t2 = ((pt.x-d.p1.x)*ddx + (pt.y-d.p1.y)*ddy) / (dlen*dlen);
                            if (t2 < 0.08 || t2 > 0.92) return false;
                            const cpx = d.p1.x + t2*ddx, cpy = d.p1.y + t2*ddy;
                            return Math.hypot(pt.x-cpx, pt.y-cpy) < 5;
                        });
                        if(!throughDoor){ blocked=true; break; }
                    }
                    if(blocked) break;
                    litCells.add(`${cx},${cy}`);
                    px=x; py=y;
                }
            }
        });
        litCellsCache = litCells;
        return litCells;
    }

    function invalidateLitCache() { litCellsCache = null; }

    function redrawLightFogCuts() {
        const litCells=computeLitCells();
        litCells.forEach(key=>{
            const [cx,cy]=key.split(',').map(Number);
            fogBufferCtx.clearRect(cx*CELL+FOG_OFFSET,cy*CELL+FOG_OFFSET,CELL,CELL);
        });
    }

    const fogPolyCanvas = document.getElementById('fog-poly-canvas');
    const fogPolyCtx    = fogPolyCanvas.getContext('2d');
    let fogPolyMode     = null;  // 'apply' | 'cut' | null
    let fogPolyVerts    = [];    // [{x,y}] in grid coords, snapped to intersections
    let fogPolyMousePos = null;  // current mouse grid pos for preview line

    function snapToIntersection(x, y, useCenter = false) {
        // Intersection snap
        const ix = Math.round((x - FOG_OFFSET) / 50) * 50 + FOG_OFFSET;
        const iy = Math.round((y - FOG_OFFSET) / 50) * 50 + FOG_OFFSET;
        if (useCenter) {
            // Cell center snap
            const cx = Math.floor((x - FOG_OFFSET) / 50) * 50 + FOG_OFFSET + 25;
            const cy = Math.floor((y - FOG_OFFSET) / 50) * 50 + FOG_OFFSET + 25;
            return { x: cx, y: cy };
        }
        // Smart snap: pick whichever is closer — intersection or cell center
        const cx = Math.floor((x - FOG_OFFSET) / 50) * 50 + FOG_OFFSET + 25;
        const cy = Math.floor((y - FOG_OFFSET) / 50) * 50 + FOG_OFFSET + 25;
        const dIntersect = Math.hypot(x - ix, y - iy);
        const dCenter    = Math.hypot(x - cx, y - cy);
        return dCenter < dIntersect ? { x: cx, y: cy } : { x: ix, y: iy };
    }

    function pointInPolygon(px, py, verts) {
        let inside = false;
        for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
            const xi = verts[i].x, yi = verts[i].y;
            const xj = verts[j].x, yj = verts[j].y;
            if (((yi > py) !== (yj > py)) && px < ((xj - xi) * (py - yi) / (yj - yi) + xi))
                inside = !inside;
        }
        return inside;
    }

    function applyFogPolygon(verts, painting) {
        if (verts.length < 3) return;
        // Bounding box of polygon in cell coords
        const xs = verts.map(v => v.x), ys = verts.map(v => v.y);
        const minCX = Math.max(0,   Math.floor(Math.min(...xs) / 50));
        const maxCX = Math.min(99,  Math.ceil( Math.max(...xs) / 50));
        const minCY = Math.max(0,   Math.floor(Math.min(...ys) / 50));
        const maxCY = Math.min(99,  Math.ceil( Math.max(...ys) / 50));
        const changed = [];
        for (let cx = minCX; cx <= maxCX; cx++) {
            for (let cy = minCY; cy <= maxCY; cy++) {
                // Test cell center against polygon
                const cellCenterX = cx * 50 + FOG_OFFSET + 25;
                const cellCenterY = cy * 50 + FOG_OFFSET + 25;
                if (pointInPolygon(cellCenterX, cellCenterY, verts)) {
                    const key = `${cx},${cy}`;
                    if (painting && !fogCells.has(key)) {
                        fogCells.add(key); drawFogCell(cx, cy);
                        changed.push({ cx, cy, fog: true });
                    } else if (!painting && fogCells.has(key)) {
                        fogCells.delete(key); eraseFogCell(cx, cy);
                        changed.push({ cx, cy, fog: false });
                    }
                }
            }
        }
        if (changed.length) broadcast({ type: 'fog_cells', cells: changed });
    }

    function drawFogPolyPreview() {
        fogPolyCtx.clearRect(0, 0, fogPolyCanvas.width, fogPolyCanvas.height);
        if (!fogPolyVerts.length) return;
        const color = fogPolyMode === 'apply' ? 'rgba(80,140,255,0.8)' : 'rgba(255,160,40,0.8)';
        const fill  = fogPolyMode === 'apply' ? 'rgba(80,140,255,0.15)' : 'rgba(255,160,40,0.15)';
        fogPolyCtx.strokeStyle = color; fogPolyCtx.lineWidth = 2; fogPolyCtx.setLineDash([6,4]);
        fogPolyCtx.fillStyle = fill;
        fogPolyCtx.beginPath();
        fogPolyCtx.moveTo(fogPolyVerts[0].x, fogPolyVerts[0].y);
        fogPolyVerts.forEach(v => fogPolyCtx.lineTo(v.x, v.y));
        // Preview line to current mouse
        if (fogPolyMousePos) fogPolyCtx.lineTo(fogPolyMousePos.x, fogPolyMousePos.y);
        fogPolyCtx.stroke();
        if (fogPolyVerts.length > 2) fogPolyCtx.fill();
        fogPolyCtx.setLineDash([]);
        // Draw vertex dots
        fogPolyVerts.forEach((v, i) => {
            fogPolyCtx.beginPath();
            fogPolyCtx.arc(v.x, v.y, i === 0 ? 7 : 4, 0, Math.PI*2);
            fogPolyCtx.fillStyle = i === 0 ? color : 'white';
            fogPolyCtx.fill();
            fogPolyCtx.strokeStyle = color; fogPolyCtx.lineWidth = 2;
            fogPolyCtx.stroke();
        });
    }

    function startFogPoly(mode) {
        fogPolyMode  = fogPolyMode === mode ? null : mode;
        fogPolyVerts = [];
        fogPolyMousePos = null;
        fogPolyCtx.clearRect(0, 0, fogPolyCanvas.width, fogPolyCanvas.height);
        document.getElementById('btn-fog-poly-apply').classList.toggle('active', fogPolyMode === 'apply');
        document.getElementById('btn-fog-poly-cut').classList.toggle('active',   fogPolyMode === 'cut');
        // Deselect brush fog tools
        if (fogPolyMode) {
            currentFogTool = null;
            document.getElementById('btn-fog-paint').classList.remove('active');
            document.getElementById('btn-fog-reveal').classList.remove('active');
            clearTool();
        }
    }

    // Viewport click handler for polygon vertex placement
    viewport.addEventListener('click', e => {
        if (!fogPolyMode || e.button !== 0) return;
        const pos = viewportToGrid(e.clientX, e.clientY);
        const snapped = snapToIntersection(pos.x, pos.y, shiftHeld);
        // Close polygon if clicking near first vertex
        if (fogPolyVerts.length >= 3) {
            const first = fogPolyVerts[0];
            const dist  = Math.hypot(snapped.x - first.x, snapped.y - first.y);
            if (dist < 30) {
                applyFogPolygon(fogPolyVerts, fogPolyMode === 'apply');
                fogPolyVerts = []; fogPolyMousePos = null;
                fogPolyCtx.clearRect(0, 0, fogPolyCanvas.width, fogPolyCanvas.height);
                return;
            }
        }
        fogPolyVerts.push(snapped);
        drawFogPolyPreview();
    });

    // Double-click closes polygon
    viewport.addEventListener('dblclick', e => {
        if (!fogPolyMode || fogPolyVerts.length < 3) return;
        e.preventDefault();
        // Remove the extra vertex added by the preceding single click
        fogPolyVerts.pop();
        applyFogPolygon(fogPolyVerts, fogPolyMode === 'apply');
        fogPolyVerts = []; fogPolyMousePos = null;
        fogPolyCtx.clearRect(0, 0, fogPolyCanvas.width, fogPolyCanvas.height);
    });

    // Escape cancels in-progress polygon
    // (wired into existing keydown handler below)


    // ── Fog Presets ──────────────────────────────────────────────────────────
    const fogPresetCanvas = document.getElementById('fog-preset-canvas');
    const fogPresetCtx    = fogPresetCanvas.getContext('2d');
    const doorCanvas      = document.getElementById('door-canvas');
    const doorCtx         = doorCanvas.getContext('2d');
    const wallsCanvas     = document.getElementById('walls-canvas');
    const wallsCtx        = wallsCanvas.getContext('2d');

    function redrawWalls() {
        if (!isHost) wallsCtx.clearRect(0, 0, wallsCanvas.width, wallsCanvas.height);
        wallsCtx.strokeStyle = 'rgba(18,14,10,0.7)';
        wallsCtx.lineWidth   = 6;
        wallsCtx.lineCap     = 'square';

        if (isHost) {
            fogPresetCtx.strokeStyle = 'rgba(18,14,10,0.7)';
            fogPresetCtx.lineWidth   = 6;
            fogPresetCtx.lineCap     = 'square';
            fogPresetCtx.setLineDash([]);
        }

        // Collect edges and deduplicate shared walls between adjacent polygons
        // so each wall segment is drawn exactly once (no double-draw artifacts)
        const unique = [];
        fogPresets.forEach(p => {
            if (!p.verts || p.verts.length < 2) return;
            const n = p.verts.length;
            for (let i = 0; i < n; i++) {
                const a = p.verts[i], b = p.verts[(i+1)%n];
                const dup = unique.some(e =>
                    (Math.hypot(e.ax-a.x,e.ay-a.y)<3 && Math.hypot(e.bx-b.x,e.by-b.y)<3) ||
                    (Math.hypot(e.ax-b.x,e.ay-b.y)<3 && Math.hypot(e.bx-a.x,e.by-a.y)<3)
                );
                if (!dup) unique.push({ax:a.x,ay:a.y,bx:b.x,by:b.y});
            }
        });

        unique.forEach(e => drawWallEdge(e.ax, e.ay, e.bx, e.by));
    }

    function drawWallEdge(ax, ay, bx, by) {
        const len = Math.hypot(bx-ax, by-ay);
        if (len < 1) return;
        const ux = (bx-ax)/len, uy = (by-ay)/len;

        // Find door gaps — skip secret closed doors (they look like solid walls)
        const gaps = [];
        doors.forEach(d => {
            if (d.secret && !d.open) return; // secret door = no gap in wall
            const dx = d.p2.x-d.p1.x, dy = d.p2.y-d.p1.y;
            if (Math.abs(ux*dy - uy*dx) > 5) return;
            if (Math.abs((d.p1.x-ax)*uy - (d.p1.y-ay)*ux) > 5) return;
            const t1 = (d.p1.x-ax)*ux + (d.p1.y-ay)*uy;
            const t2 = (d.p2.x-ax)*ux + (d.p2.y-ay)*uy;
            const gs = Math.max(0, Math.min(t1,t2));
            const ge = Math.min(len, Math.max(t1,t2));
            if (ge > gs) gaps.push({ s: gs, e: ge });
        });

        const drawSegment = (ctx, x1, y1, x2, y2) => {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        };

        const drawEdge = (ctx) => {
            if (!gaps.length) { drawSegment(ctx, ax, ay, bx, by); return; }
            gaps.sort((a,b) => a.s - b.s);
            let pos = 0;
            gaps.forEach(g => {
                if (pos < g.s) drawSegment(ctx, ax+ux*pos, ay+uy*pos, ax+ux*g.s, ay+uy*g.s);
                pos = g.e;
            });
            if (pos < len) drawSegment(ctx, ax+ux*pos, ay+uy*pos, bx, by);
        };

        // Each viewer draws on exactly ONE canvas to avoid double-draw artifacts:
        // Host → fogPresetCtx (z-index 515, above fog, always visible)
        // Players → wallsCtx (z-index 349, below fog, hidden in dark areas)
        if (isHost) drawEdge(fogPresetCtx);
        else        drawEdge(wallsCtx);
    }

    function isDoorLit(d) {
        if (isHost) return true;
        if (d.secret && !d.open) return false;
        const litCells = computeLitCells();
        // Door sits on a wall boundary — check its cells AND all immediate neighbours
        // so it's visible when the lit room is on either side
        const checkPts = [
            d.p1,
            d.p2,
            { x: (d.p1.x+d.p2.x)/2, y: (d.p1.y+d.p2.y)/2 }
        ];
        for (const pt of checkPts) {
            const cx = Math.floor((pt.x - FOG_OFFSET) / CELL);
            const cy = Math.floor((pt.y - FOG_OFFSET) / CELL);
            for (let dx = -1; dx <= 1; dx++)
                for (let dy = -1; dy <= 1; dy++)
                    if (litCells.has(`${cx+dx},${cy+dy}`)) return true;
        }
        return false;
    }

    function redrawDoors() {
        invalidateLitCache(); // ensure fresh lit cells for isDoorLit
        doorCtx.clearRect(0, 0, doorCanvas.width, doorCanvas.height);
        doors.forEach(d => { if (isDoorLit(d)) drawDoor(d, doorCtx); });
    }
    let fogPresets        = [];   // [{id, verts, fogged}]
    let nextPresetId      = 1;
    let fogPresetMode     = null; // 'define' | 'toggle' | null
    let presetDefVerts    = [];   // vertices being defined
    let presetDefMouse    = null;

    // ── Doors ────────────────────────────────────────────────────────────────
    let doors        = [];   // [{id, p1:{x,y}, p2:{x,y}, open}]
    let nextDoorId   = 1;
    let doorMode     = false; // true = placing a door
    let doorP1       = null;  // first point placed
    let doorMouse    = null;  // current mouse pos for preview
    let secretMode   = false; // next placed door will be secret

    document.getElementById('btn-fog-secret-door')?.addEventListener('click', () => {
        secretMode = !secretMode;
        const btn = document.getElementById('btn-fog-secret-door');
        btn.classList.toggle('active', secretMode);
        btn.title = secretMode ? 'Secret mode ON — next door placed will be secret' : 'Secret door mode (off)';
    });

    function drawPresetOutlines() {
        fogPresetCtx.clearRect(0, 0, fogPresetCanvas.width, fogPresetCanvas.height);
        redrawDoors(); // always redraw doors for all players
        redrawWalls(); // wall lines: below fog for players, on fogPresetCtx for host
        if (!isHost) return;
        fogPresets.forEach(p => {
            if (p.verts.length < 2) return;
            const color = p.fogged ? 'rgba(60,200,80,0.9)' : 'rgba(60,200,80,0.45)';
            fogPresetCtx.strokeStyle = color;
            fogPresetCtx.lineWidth = 1.5;
            fogPresetCtx.setLineDash([6, 4]);
            fogPresetCtx.beginPath();
            fogPresetCtx.moveTo(p.verts[0].x, p.verts[0].y);
            p.verts.forEach(v => fogPresetCtx.lineTo(v.x, v.y));
            fogPresetCtx.closePath();
            fogPresetCtx.stroke();
            fogPresetCtx.setLineDash([]);
        });

        // Doors rendered on their own canvas via redrawDoors()
        redrawDoors();

        // Door placement preview
        if (doorMode && doorMouse) {
            fogPresetCtx.setLineDash([4, 3]);
            fogPresetCtx.strokeStyle = '#e8c840';
            fogPresetCtx.lineWidth   = 2;
            if (doorP1) {
                fogPresetCtx.beginPath();
                fogPresetCtx.moveTo(doorP1.x, doorP1.y);
                fogPresetCtx.lineTo(doorMouse.x, doorMouse.y);
                fogPresetCtx.stroke();
                fogPresetCtx.setLineDash([]);
                fogPresetCtx.fillStyle = '#e8c840';
                fogPresetCtx.beginPath();
                fogPresetCtx.arc(doorP1.x, doorP1.y, 5, 0, Math.PI * 2);
                fogPresetCtx.fill();
            }
            fogPresetCtx.setLineDash([]);
            fogPresetCtx.fillStyle = '#e8c840';
            fogPresetCtx.beginPath();
            fogPresetCtx.arc(doorMouse.x, doorMouse.y, 4, 0, Math.PI * 2);
            fogPresetCtx.fill();
            fogPresetCtx.strokeStyle = '#e8c840'; fogPresetCtx.lineWidth = 1;
            fogPresetCtx.beginPath();
            const arm = 8;
            fogPresetCtx.moveTo(doorMouse.x - arm, doorMouse.y); fogPresetCtx.lineTo(doorMouse.x + arm, doorMouse.y);
            fogPresetCtx.moveTo(doorMouse.x, doorMouse.y - arm); fogPresetCtx.lineTo(doorMouse.x, doorMouse.y + arm);
            fogPresetCtx.stroke();
        }
        // Draw in-progress define preview
        if (fogPresetMode === 'define') {
            if (presetDefVerts.length > 0) {
                fogPresetCtx.strokeStyle = 'rgba(60,200,80,0.8)';
                fogPresetCtx.lineWidth = 1.5;
                fogPresetCtx.setLineDash([4, 4]);
                fogPresetCtx.beginPath();
                fogPresetCtx.moveTo(presetDefVerts[0].x, presetDefVerts[0].y);
                presetDefVerts.forEach(v => fogPresetCtx.lineTo(v.x, v.y));
                if (presetDefMouse) fogPresetCtx.lineTo(presetDefMouse.x, presetDefMouse.y);
                fogPresetCtx.stroke();
                fogPresetCtx.setLineDash([]);
                // Placed vertex dots
                presetDefVerts.forEach((v, i) => {
                    fogPresetCtx.beginPath();
                    fogPresetCtx.arc(v.x, v.y, i === 0 ? 7 : 4, 0, Math.PI*2);
                    fogPresetCtx.fillStyle = i === 0 ? 'rgba(60,200,80,0.9)' : 'white';
                    fogPresetCtx.fill();
                    fogPresetCtx.strokeStyle = 'rgba(60,200,80,0.9)';
                    fogPresetCtx.lineWidth = 2; fogPresetCtx.stroke();
                });
            }
            // Snap indicator — always show while in define mode
            if (presetDefMouse) {
                const nearFirst = presetDefVerts.length >= 3 &&
                    Math.hypot(presetDefMouse.x - presetDefVerts[0].x, presetDefMouse.y - presetDefVerts[0].y) < 30;
                const snapColor = nearFirst ? 'rgba(255,220,60,0.95)' : 'rgba(60,200,80,0.9)';
                const snapSize  = shiftHeld ? 6 : 4; // larger dot for center snap
                // Crosshair lines
                fogPresetCtx.strokeStyle = snapColor;
                fogPresetCtx.lineWidth = 1;
                fogPresetCtx.setLineDash([]);
                const cx = presetDefMouse.x, cy = presetDefMouse.y, arm = 10;
                fogPresetCtx.beginPath();
                fogPresetCtx.moveTo(cx - arm, cy); fogPresetCtx.lineTo(cx + arm, cy);
                fogPresetCtx.moveTo(cx, cy - arm); fogPresetCtx.lineTo(cx, cy + arm);
                fogPresetCtx.stroke();
                // Center dot
                fogPresetCtx.beginPath();
                fogPresetCtx.arc(cx, cy, snapSize, 0, Math.PI*2);
                fogPresetCtx.fillStyle = snapColor;
                fogPresetCtx.fill();
                // Label: show "center" or "intersection"
                fogPresetCtx.font = '10px sans-serif';
                fogPresetCtx.fillStyle = snapColor;
                fogPresetCtx.fillText(nearFirst ? 'close' : shiftHeld ? '·center' : '+ intersect', cx + 12, cy - 6);
            }
        }
    }

    function startFogPresetMode(mode) {
        fogPresetMode = fogPresetMode === mode ? null : mode;
        presetDefVerts = []; presetDefMouse = null;
        document.getElementById('btn-fog-preset-define').classList.toggle('active', fogPresetMode === 'define');
        document.getElementById('btn-fog-preset-toggle').classList.toggle('active', fogPresetMode === 'toggle');
        document.getElementById('btn-fog-preset-delete').classList.toggle('active', fogPresetMode === 'delete');
        if (fogPresetMode) {
            currentFogTool = null;
            document.getElementById('btn-fog-paint').classList.remove('active');
            document.getElementById('btn-fog-reveal').classList.remove('active');
            if (fogPolyMode) startFogPoly(fogPolyMode);
            clearTool();
        }
        drawPresetOutlines();
    }

    function drawDoor(d, ctx) {
        // Hard guard — players never see closed secret doors under any circumstances
        if (!isHost && d.secret && !d.open) return;

        const mx   = (d.p1.x + d.p2.x) / 2;
        const my   = (d.p1.y + d.p2.y) / 2;
        const len  = Math.hypot(d.p2.x - d.p1.x, d.p2.y - d.p1.y) || 1;
        const ang  = Math.atan2(d.p2.y - d.p1.y, d.p2.x - d.p1.x);

        const doorH = 10;
        const capW  = 10;
        const capH  = 16;
        const half  = len / 2;

        ctx.save();
        ctx.translate(mx, my);
        ctx.rotate(ang);

        if (d.open) {
            // Open: end caps only, no panel
            ctx.fillStyle   = '#111';
            ctx.strokeStyle = d.secret ? '#cc3333' : '#333';
            ctx.lineWidth   = 1;
            ctx.fillRect(-half - capW / 2, -capH / 2, capW, capH);
            ctx.strokeRect(-half - capW / 2, -capH / 2, capW, capH);
            ctx.fillRect( half - capW / 2, -capH / 2, capW, capH);
            ctx.strokeRect( half - capW / 2, -capH / 2, capW, capH);
        } else if (d.secret) {
            // Secret closed door: host-only red dashed outline, no brown fill
            ctx.setLineDash([4, 3]);
            ctx.strokeStyle = '#cc3333';
            ctx.lineWidth   = 2;
            ctx.strokeRect(-half, -doorH / 2, len, doorH);
            ctx.setLineDash([]);
            ctx.fillStyle   = '#cc3333';
            ctx.fillRect(-half - capW / 2, -capH / 2, capW, capH);
            ctx.fillRect( half - capW / 2, -capH / 2, capW, capH);
        } else {
            // Normal closed door
            ctx.fillStyle   = '#7a4020';
            ctx.strokeStyle = '#111';
            ctx.lineWidth   = 1.5;
            ctx.fillRect(-half, -doorH / 2, len, doorH);
            ctx.strokeRect(-half, -doorH / 2, len, doorH);
            ctx.fillStyle   = '#111';
            ctx.strokeStyle = '#333';
            ctx.lineWidth   = 1;
            ctx.fillRect(-half - capW / 2, -capH / 2, capW, capH);
            ctx.strokeRect(-half - capW / 2, -capH / 2, capW, capH);
            ctx.fillRect( half - capW / 2, -capH / 2, capW, capH);
            ctx.strokeRect( half - capW / 2, -capH / 2, capW, capH);
        }

        ctx.restore();
    }

    // Returns the two "room side" test points for a door (15px either side of midpoint)
    function doorSidePoints(d) {
        const mx  = (d.p1.x + d.p2.x) / 2, my = (d.p1.y + d.p2.y) / 2;
        const len = Math.hypot(d.p2.x - d.p1.x, d.p2.y - d.p1.y) || 1;
        const nx  = -(d.p2.y - d.p1.y) / len, ny = (d.p2.x - d.p1.x) / len;
        const off = 15;
        return [
            { x: mx + nx * off, y: my + ny * off },
            { x: mx - nx * off, y: my - ny * off }
        ];
    }

    // Returns true if this door touches (has a side inside) the given polygon
    // Point-to-segment distance helper for door click detection
    function ptSegDist(px, py, ax, ay, bx, by) {
        const dx = bx - ax, dy = by - ay;
        const lenSq = dx * dx + dy * dy;
        if (lenSq === 0) return Math.hypot(px - ax, py - ay);
        const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
        return Math.hypot(px - ax - t * dx, py - ay - t * dy);
    }

    // Door tool button
    document.getElementById('btn-fog-door')?.addEventListener('click', () => {
        doorMode = !doorMode;
        doorP1   = null;
        fogPresetMode = null;
        document.getElementById('btn-fog-door').classList.toggle('active', doorMode);
        document.getElementById('btn-fog-preset-define')?.classList.remove('active');
        document.getElementById('btn-fog-preset-toggle')?.classList.remove('active');
        document.getElementById('btn-fog-preset-delete')?.classList.remove('active');
        // Preserve secret mode indicator
        if (secretMode) document.getElementById('btn-fog-secret-door')?.classList.add('active');
        viewport.style.cursor = doorMode ? 'crosshair' : 'default';
        drawPresetOutlines();
    });

    // Door mousemove — snap preview
    viewport.addEventListener('mousemove', e2 => {
        if (!doorMode) return;
        const pos = viewportToGrid(e2.clientX, e2.clientY);
        doorMouse = snapToIntersection(pos.x, pos.y, shiftHeld);
        drawPresetOutlines();
    });

    function showDoorDeleteMenu(x, y, door) {
        document.querySelectorAll('.door-ctx-menu').forEach(m => m.remove());
        const menu = document.createElement('div');
        menu.className = 'door-ctx-menu';
        menu.style.cssText = `position:fixed;left:${x}px;top:${y}px;background:#1a1510;border:1px solid #993333;border-radius:7px;padding:8px;z-index:9001;font-family:var(--font-serif);box-shadow:0 4px 16px rgba(0,0,0,0.8);`;

        const secretBtn = document.createElement('button');
        secretBtn.textContent = door.secret ? '🔓 Make Normal Door' : '🔴 Make Secret Door';
        secretBtn.style.cssText = `display:block;width:100%;padding:6px 12px;background:transparent;color:#f8a;border:none;border-radius:4px;font-family:var(--font-serif);font-size:13px;cursor:pointer;text-align:left;`;
        secretBtn.onmouseenter = () => secretBtn.style.background = 'rgba(200,60,60,0.15)';
        secretBtn.onmouseleave = () => secretBtn.style.background = 'transparent';
        secretBtn.addEventListener('click', e => {
            e.stopPropagation();
            door.secret = !door.secret;
            broadcast({ type: 'door_update', id: door.id, open: door.open, secret: door.secret });
            redrawDoors(); menu.remove();
        });

        const delBtn = document.createElement('button');
        delBtn.textContent = '🗑️ Delete Door';
        delBtn.style.cssText = `display:block;width:100%;padding:6px 12px;background:transparent;color:#f88;border:none;border-radius:4px;font-family:var(--font-serif);font-size:13px;cursor:pointer;text-align:left;`;
        delBtn.onmouseenter = () => delBtn.style.background = 'rgba(200,60,60,0.15)';
        delBtn.onmouseleave = () => delBtn.style.background = 'transparent';
        delBtn.addEventListener('click', e => {
            e.stopPropagation();
            doors = doors.filter(d => d.id !== door.id);
            broadcast({ type: 'door_delete', id: door.id });
            redrawFog(); drawPresetOutlines(); menu.remove();
        });

        menu.appendChild(secretBtn); menu.appendChild(delBtn);
        document.body.appendChild(menu);
        menu.addEventListener('mousedown', e => e.stopPropagation());
        const close = () => { menu.remove(); document.removeEventListener('click', close); };
        setTimeout(() => document.addEventListener('click', close), 10);
    }

    // Door left-click via mouseup (fires before click, avoids double-trigger)
    let leftDownPos = null;
    viewport.addEventListener('mousedown', e => {
        if (e.button === 0) leftDownPos = { x: e.clientX, y: e.clientY };
    });

    viewport.addEventListener('mouseup', e => {
        if (e.button !== 0) return;
        // Ignore if mouse moved too much (was a pan/drag)
        if (leftDownPos && Math.hypot(e.clientX - leftDownPos.x, e.clientY - leftDownPos.y) > 10) return;
        const pos = viewportToGrid(e.clientX, e.clientY);

        // Toggle door in any mode (no door mode required)
        if (isHost && !doorMode && !doorP1) {
            const hit = doors.find(d => ptSegDist(pos.x, pos.y, d.p1.x, d.p1.y, d.p2.x, d.p2.y) < 15);
            if (hit) {
                hit.open = !hit.open;
                broadcast({ type: 'door_update', id: hit.id, open: hit.open, secret: hit.secret });
                redrawFog(); drawPresetOutlines();
                return;
            }
        }

        if (!doorMode) return;
        const snapped = snapToIntersection(pos.x, pos.y, shiftHeld);

        if (!doorP1) {
            // Check if clicking near an existing door — toggle it
            const hit = doors.find(d => ptSegDist(pos.x, pos.y, d.p1.x, d.p1.y, d.p2.x, d.p2.y) < 15);
            if (hit) {
                hit.open = !hit.open;
                broadcast({ type: 'door_update', id: hit.id, open: hit.open, secret: hit.secret });
                redrawFog(); drawPresetOutlines();
                return;
            }
            doorP1 = snapped; // set first point
        } else {
            // Prevent zero-length doors
            if (Math.hypot(snapped.x - doorP1.x, snapped.y - doorP1.y) < 5) {
                doorP1 = null; drawPresetOutlines(); return;
            }
            const door = { id: nextDoorId++, p1: { ...doorP1 }, p2: { ...snapped }, open: false, secret: secretMode };
            doors.push(door);
            broadcast({ type: 'door_add', door: { ...door } });
            doorP1 = null;
            // Reset secret mode after placement so you don't accidentally make all doors secret
            if (secretMode) {
                secretMode = false;
                document.getElementById('btn-fog-secret-door')?.classList.remove('active');
            }
            drawPresetOutlines();
        }
    });

    function applyPresetFog(preset, fogged) {
        preset.fogged = fogged;
        redrawFog();
        redrawWalls();
        broadcast({ type: 'preset_update', id: preset.id, fogged: preset.fogged });
        drawPresetOutlines();
    }

    // Viewport click for preset define and toggle
    viewport.addEventListener('click', e => {
        if (!fogPresetMode || e.button !== 0) return;
        const pos = viewportToGrid(e.clientX, e.clientY);

        if (fogPresetMode === 'define') {
            const snapped = snapToIntersection(pos.x, pos.y, shiftHeld);
            // Close if near first vertex
            if (presetDefVerts.length >= 3) {
                const first = presetDefVerts[0];
                if (Math.hypot(snapped.x - first.x, snapped.y - first.y) < 30) {
                    const preset = { id: nextPresetId++, verts: [...presetDefVerts], fogged: true };
                    fogPresets.push(preset);
                    applyPresetFog(preset, true);
                    broadcast({ type: 'preset_add', preset: { id: preset.id, verts: preset.verts, fogged: preset.fogged } });
                    presetDefVerts = []; presetDefMouse = null;
                    drawPresetOutlines();
                    return;
                }
            }
            presetDefVerts.push(snapped);
            drawPresetOutlines();

        } else if (fogPresetMode === 'toggle') {
            // Find which preset was clicked
            for (const preset of fogPresets) {
                if (pointInPolygon(pos.x, pos.y, preset.verts)) {
                    applyPresetFog(preset, !preset.fogged);
                    return;
                }
            }
        } else if (fogPresetMode === 'delete') {
            for (let i = fogPresets.length - 1; i >= 0; i--) {
                if (pointInPolygon(pos.x, pos.y, fogPresets[i].verts)) {
                    const preset = fogPresets[i];
                    // Also clear the fog inside this preset
                    const changed = [];
                    for (let cx = 0; cx < 100; cx++) {
                        for (let cy = 0; cy < 100; cy++) {
                            const cellCX = cx * 50 + FOG_OFFSET + 25;
                            const cellCY = cy * 50 + FOG_OFFSET + 25;
                            if (pointInPolygon(cellCX, cellCY, preset.verts)) {
                                const key = `${cx},${cy}`;
                                if (fogCells.has(key)) { fogCells.delete(key); eraseFogCell(cx, cy); changed.push({cx,cy,fog:false}); }
                            }
                        }
                    }
                    if (changed.length) broadcast({ type: 'fog_cells', cells: changed });
                    fogPresets.splice(i, 1);
                    broadcast({ type: 'preset_delete', id: preset.id });
                    drawPresetOutlines();
                    return;
                }
            }
        }
    });

    // Double-click closes define
    viewport.addEventListener('dblclick', e => {
        if (fogPresetMode !== 'define' || presetDefVerts.length < 3) return;
        e.preventDefault();
        presetDefVerts.pop();
        const preset = { id: nextPresetId++, verts: [...presetDefVerts], fogged: true };
        fogPresets.push(preset);
        applyPresetFog(preset, true);
        broadcast({ type: 'preset_add', preset: { id: preset.id, verts: preset.verts, fogged: preset.fogged } });
        presetDefVerts = []; presetDefMouse = null;
        drawPresetOutlines();
    });

    document.getElementById('btn-fog-preset-define')?.addEventListener('click', () => startFogPresetMode('define'));
    document.getElementById('btn-fog-preset-toggle')?.addEventListener('click', () => startFogPresetMode('toggle'));
    document.getElementById('btn-fog-preset-delete')?.addEventListener('click', () => startFogPresetMode('delete'));

    function applyFogSnapshot(cells) {
        cells.forEach(({ cx, cy }) => { fogCells.add(`${cx},${cy}`); });
        redrawFog();
    }

    function setFogTool(tool) {
        currentFogTool = currentFogTool === tool ? null : tool;
        document.querySelectorAll('.fog-btn').forEach(b => b.classList.remove('active'));
        if (currentFogTool === 'paint')  document.getElementById('btn-fog-paint').classList.add('active');
        if (currentFogTool === 'reveal') document.getElementById('btn-fog-reveal').classList.add('active');
        // Restore secret mode indicator if active
        if (secretMode) document.getElementById('btn-fog-secret-door')?.classList.add('active');
        // Cancel any in-progress polygon
        if (fogPolyMode) { fogPolyVerts=[]; fogPolyMousePos=null; fogPolyCtx?.clearRect(0,0,fogPolyCanvas?.width,fogPolyCanvas?.height); fogPolyMode=null; document.getElementById('btn-fog-poly-apply').classList.remove('active'); document.getElementById('btn-fog-poly-cut').classList.remove('active'); }
        if (currentFogTool) { clearTool(); }
    }

    // Fog tool mouse handling directly on viewport
    viewport.addEventListener('mousedown', e => {
        if (e.button === 0 && currentFogTool) {
            e.stopPropagation();
            isFogPainting = true;
            const pos = viewportToGrid(e.clientX, e.clientY);
            applyFogBrush(pos.x, pos.y, currentFogTool === 'paint');
        }
    });

    // Wire fog toolbar buttons
    document.getElementById('btn-fill-fog')?.addEventListener('click', fillFog);

    // ═══════════════════════════════════════════════════════════════════════════
    // SAVE / LOAD SYSTEM  (Cloudflare Worker + KV + pako compression)
    // ═══════════════════════════════════════════════════════════════════════════
    // Worker URL — update this after deploying gnollboard-worker.js to Cloudflare
    const WORKER_URL = window.location.search.includes('instance_id')
        ? '/gnollsaves'   // Discord Activity — routed via URL mapping
        : 'https://gnollboard-saves.gnollboard.workers.dev'; // Browser direct

    function channelId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('channel_id') || 'browser';
    }

    // Compress JSON → base64 string using pako deflate
    function compress(obj) {
        const json = JSON.stringify(obj);
        const compressed = pako.deflate(json);
        let bin = '';
        compressed.forEach(b => bin += String.fromCharCode(b));
        return btoa(bin);
    }

    // Decompress base64 string → object
    function decompress(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return JSON.parse(pako.inflate(arr, { to: 'string' }));
    }

    async function getIndex() {
        try {
            const r = await fetch(`${WORKER_URL}/index/${channelId()}`);
            if (!r.ok) return [];
            return await r.json();
        } catch { return []; }
    }

    async function setIndex(slots) {
        const r = await fetch(`${WORKER_URL}/index/${channelId()}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(slots)
        });
        if (!r.ok) throw new Error(`Index update failed: ${r.status}`);
    }
    function buildSavePayload() {
        // Encode fog as a bitmask — 100×100 = 10000 bits = 1250 bytes → ~1.6KB base64
        const bits = new Uint8Array(1250);
        fogCells.forEach(key => {
            const [cx, cy] = key.split(',').map(Number);
            const i = cy * 100 + cx;
            bits[i >> 3] |= (1 << (i & 7));
        });
        const fogB64 = btoa(String.fromCharCode(...bits));

        return {
            tokens:     tokens.map(t => ({ ...t })),
            stickers:   stickers.map(s => ({ ...s })),
            shapes:     shapes.map(s => ({ ...s })),
            textLabels: textLabels.map(t => ({ ...t })),
            mapImages:  mapImages.filter(m => m.locked && m.image).map(m => ({ ...m })),
            fogPresets: fogPresets.map(p => ({ ...p })),
            fogBitmask: fogB64,
            doors:      doors.map(d => ({ ...d })),
            notes:      notes.map(n => ({ ...n }))
        };
    }

    function applySavePayload(data) {
        tokensContainer.innerHTML=''; stickersContainer.innerHTML='';
        shapesContainer.innerHTML=''; document.getElementById('text-container').innerHTML='';
        mapContainer.innerHTML=''; mapContainerBelow.innerHTML=''; mapHandleContainer.innerHTML='';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        tokens=[]; stickers=[]; shapes=[]; textLabels=[]; mapImages=[];
        deselectObject();
        (data.tokens     ||[]).forEach(t=>{tokens.push(t);renderToken(t);if(t.blood)addBloodEffect(t);});
        (data.stickers   ||[]).forEach(s=>{stickers.push(s);renderSticker(s);});
        (data.shapes     ||[]).forEach(s=>{shapes.push(s);renderShape(s);});
        (data.textLabels ||[]).forEach(t=>{textLabels.push(t);renderTextLabel(t);});
        (data.mapImages  ||[]).forEach(m=>{mapImages.push(m);renderMapImage(m);});
        fogPresets = data.fogPresets || [];
        if (fogPresets.length) nextPresetId = Math.max(...fogPresets.map(p=>p.id)) + 1;
        drawPresetOutlines();
        // Handle bitmask (new), compact string, or legacy array format
        if (data.fogBitmask) {
            const raw  = atob(data.fogBitmask);
            const bits = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bits[i] = raw.charCodeAt(i);
            const cells = [];
            for (let i = 0; i < 10000; i++) {
                if (bits[i >> 3] & (1 << (i & 7))) {
                    cells.push({ cx: i % 100, cy: Math.floor(i / 100) });
                }
            }
            applyFogSnapshot(cells);
        } else if (data.fogCells) {
            if (typeof data.fogCells === 'string') {
                const cells = data.fogCells ? data.fogCells.split('|').map(k => { const [cx,cy]=k.split(',').map(Number); return {cx,cy}; }) : [];
                applyFogSnapshot(cells);
            } else {
                applyFogSnapshot(data.fogCells);
            }
        }
        if (tokens.length)     nextTokenId   = Math.max(...tokens.map(t=>t.id))   + 1;
        if (stickers.length)   nextStickerId = Math.max(...stickers.map(s=>s.id)) + 1;
        if (shapes.length)     nextShapeId   = Math.max(...shapes.map(s=>s.id))   + 1;
        if (textLabels.length) nextTextId    = Math.max(...textLabels.map(t=>t.id)) + 1;
        if (mapImages.length)  nextMapId     = Math.max(...mapImages.map(m=>m.id))  + 1;
        // Restore notes
        notes = data.notes || [];
        activeNoteId = null;
        renderNoteTabs();
        document.getElementById("note-panel").classList.remove("open");
        // Restore doors
        doors = data.doors || [];
        nextDoorId = doors.length ? Math.max(...doors.map(d => d.id)) + 1 : 1;
        drawPresetOutlines();
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // AUTOSAVE  (90 second interval, host only, requires prior manual save)
    // ═══════════════════════════════════════════════════════════════════════════
    let lastSaveName = null;
    let autosaveTimer = null;
    let autosaveIndicator = null;

    function createAutosaveIndicator() {
        const el = document.createElement('div');
        el.id = 'autosave-indicator';
        el.style.cssText = `position:fixed;bottom:14px;right:16px;font-family:var(--font-serif);font-size:11px;color:#666;z-index:1000;pointer-events:none;opacity:0;transition:opacity 0.5s;`;
        document.body.appendChild(el);
        return el;
    }

    function showAutosaveStatus(msg, color) {
        if (!autosaveIndicator) autosaveIndicator = createAutosaveIndicator();
        autosaveIndicator.textContent = msg;
        autosaveIndicator.style.color = color || '#666';
        autosaveIndicator.style.opacity = '1';
        clearTimeout(autosaveIndicator._fade);
        autosaveIndicator._fade = setTimeout(() => { autosaveIndicator.style.opacity = '0'; }, 3000);
    }

    async function doAutosave() {
        if (!isHost || !lastSaveName) return;
        try {
            const b64    = compress(buildSavePayload());
            const compKB = Math.round(b64.length / 1024);
            // Save to a dedicated autosave slot keyed by channel
            // Delete previous autosave slot if one exists
            try {
                const prev = await fetch(`${WORKER_URL}/index/${channelId()}_autosave`);
                if (prev.ok) {
                    const prevSlots = await prev.json();
                    if (prevSlots[0]?.slotId) {
                        await fetch(`${WORKER_URL}/slot/${prevSlots[0].slotId}`, { method: 'DELETE' });
                    }
                }
            } catch(e) { /* no previous autosave */ }

            const r = await fetch(`${WORKER_URL}/slot`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: b64
            });
            if (!r.ok) { showAutosaveStatus('⚠ Autosave failed', '#f88'); return; }
            const j      = await r.json();
            const slotId = j.id;

            // Store autosave entry in a dedicated autosave index key
            const autosaveSlot = { name: `Autosave — ${lastSaveName}`, slotId, savedAt: new Date().toLocaleString(), sizeKB: compKB, isAutosave: true };
            await fetch(`${WORKER_URL}/index/${channelId()}_autosave`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify([autosaveSlot])
            });

            showAutosaveStatus(`💾 Autosaved — ${lastSaveName} (${compKB}KB)`, '#8a8');
        } catch(e) {
            showAutosaveStatus('⚠ Autosave failed', '#f88');
        }
    }

    function startAutosave() {
        if (autosaveTimer) clearInterval(autosaveTimer);
        autosaveTimer = setInterval(doAutosave, 90 * 1000);
    }

    function stopAutosave() {
        if (autosaveTimer) { clearInterval(autosaveTimer); autosaveTimer = null; }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // MEASURE TOOL  (local only — no broadcast)
    // ═══════════════════════════════════════════════════════════════════════════
    const measureCanvas = document.getElementById('measure-canvas');
    const measureCtx    = measureCanvas.getContext('2d');
    let measureActive   = false;
    let measureStart    = null;  // {x, y} grid coords
    let measureEnd      = null;

    function toggleMeasure() {
        measureActive = !measureActive;
        document.getElementById('measure-toggle').classList.toggle('active', measureActive);
        if (!measureActive) clearMeasure();
    }

    function clearMeasure() {
        measureCtx.clearRect(0, 0, measureCanvas.width, measureCanvas.height);
        measureStart = measureEnd = null;
    }

    function drawMeasure(x1, y1, x2, y2) {
        measureCtx.clearRect(0, 0, measureCanvas.width, measureCanvas.height);

        // Snap to nearest cell center: centers at 33, 83, 133... (= 8 + n*50 + 25)
        function snapCell(v) {
            const cell = Math.round((v - FOG_OFFSET - CELL/2) / CELL);
            return FOG_OFFSET + Math.max(0, cell) * CELL + CELL/2;
        }
        const snap1 = { x: snapCell(x1), y: snapCell(y1) };
        const snap2 = { x: snapCell(x2), y: snapCell(y2) };

        // Distance in cells (Chebyshev — diagonal = 1 square)
        const dcx = Math.abs(Math.round((snap2.x - snap1.x) / 50));
        const dcy = Math.abs(Math.round((snap2.y - snap1.y) / 50));
        const cells = Math.max(dcx, dcy);
        const feet  = cells * 5;

        // Draw line between snapped points
        measureCtx.save();
        measureCtx.strokeStyle = 'rgba(255,200,50,0.9)';
        measureCtx.lineWidth   = 2 / zoom;
        measureCtx.setLineDash([8 / zoom, 4 / zoom]);
        measureCtx.lineCap     = 'round';
        measureCtx.beginPath();
        measureCtx.moveTo(snap1.x, snap1.y);
        measureCtx.lineTo(snap2.x, snap2.y);
        measureCtx.stroke();
        measureCtx.setLineDash([]);

        // Endpoint dots on snapped positions
        measureCtx.fillStyle = 'rgba(255,200,50,0.95)';
        [snap1, snap2].forEach(p => {
            measureCtx.beginPath();
            measureCtx.arc(p.x, p.y, 5 / zoom, 0, Math.PI * 2);
            measureCtx.fill();
        });

        // Draw label at midpoint
        const mx = (snap1.x + snap2.x) / 2;
        const my = (snap1.y + snap2.y) / 2;
        const label = `${feet} ft`;
        const fs = Math.max(14, 16 / zoom);
        measureCtx.font         = `bold ${fs}px Georgia, serif`;
        measureCtx.textAlign     = 'center';
        measureCtx.textBaseline  = 'middle';

        // Background pill
        const tw = measureCtx.measureText(label).width;
        const pad = 6 / zoom;
        measureCtx.fillStyle = 'rgba(0,0,0,0.65)';
        roundRect(measureCtx, mx - tw/2 - pad, my - fs/2 - pad, tw + pad*2, fs + pad*2, 4/zoom);
        measureCtx.fill();

        // Label text
        measureCtx.fillStyle = '#ffe060';
        measureCtx.fillText(label, mx, my);
        measureCtx.restore();
    }

    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x+r, y);
        ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
        ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
        ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
        ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
        ctx.closePath();
    }

    function viewportToGrid(cx, cy) {
        const rect = gridContainer.getBoundingClientRect();
        return { x: (cx-rect.left)/zoom, y: (cy-rect.top)/zoom };

    // ── Attachment system ────────────────────────────────────────────────────
    // Objects can have parentId — when parent moves, children move with it.
    function getAllObjects() {
        return [
            ...tokens.map(o => ({ type:'token', data:o, container: tokensContainer })),
            ...stickers.map(o => ({ type:'sticker', data:o, container: stickersContainer })),
            ...shapes.map(o => ({ type:'shape', data:o, container: shapesContainer })),
            ...textLabels.map(o => ({ type:'text', data:o, container: document.getElementById('text-container') })),
        ];
    }

    function getChildren(parentId) {
        return getAllObjects().filter(o => o.data.parentId === parentId);
    }

    // excludeId prevents double-moving the object already being dragged
    function moveChildren(parentId, dx, dy, excludeId) {
        getChildren(parentId).forEach(({ type, data, container }) => {
            if (data.id === excludeId) return;
            data.x += dx; data.y += dy;
            const el = container.querySelector(`[data-id="${data.id}"]`);
            if (el) updateObjDiv(data, el);
            broadcastMove(type+'_'+data.id, { type: type+'_move', id: data.id, x: data.x, y: data.y });
            moveChildren(data.id, dx, dy, excludeId);
        });
    }

    function moveAttached(type, id, dx, dy) {
        if (!dx && !dy) return;
        // Move children of the dragged object
        moveChildren(id, dx, dy, null);
        // If this object is a child, also move its parent and siblings (but not itself)
        const self = getAllObjects().find(o => o.data.id === id);
        if (self?.data.parentId) {
            const parent = getAllObjects().find(o => o.data.id === self.data.parentId);
            if (parent) {
                parent.data.x += dx; parent.data.y += dy;
                const el = parent.container.querySelector(`[data-id="${parent.data.id}"]`);
                if (el) updateObjDiv(parent.data, el);
                broadcastMove(parent.type+'_'+parent.data.id, { type: parent.type+'_move', id: parent.data.id, x: parent.data.x, y: parent.data.y });
                // Move siblings but exclude the token already being dragged
                moveChildren(parent.data.id, dx, dy, id);
            }
        }
    }

    function makeAttachBtn(obj, type, menu, btnStyle) {
        const attached = obj.parentId ? 'Detach' : 'Attach To...';
        const btn = document.createElement('button');
