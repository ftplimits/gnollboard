        // Stop whatever is playing
        musicAudio.pause();
        musicAudio.src = `./music/${encodeURIComponent(filename)}`;
        currentTrack = filename;
        musicAudio.load();
        musicAudio.play().catch(() => {});
        if (!fromPeer) broadcast({ type: 'music_play', filename });
        updateTrackList();
    }

    function updateTrackList() {
        const list = document.getElementById('music-track-list');
        if (!list) return;
        list.innerHTML = '';
        MUSIC_TRACKS.forEach(filename => {
            const row = document.createElement('div');
            const isPlaying = currentTrack === filename && !musicAudio.paused;
            row.className = 'music-track' + (currentTrack === filename ? ' playing' : '');
            row.innerHTML = `<span class="music-track-icon">${isPlaying ? '▶' : '○'}</span><span>${filename.replace(/\.[^.]+$/, '')}</span>`;
            if (isHost) row.addEventListener('click', () => playTrack(filename));
            list.appendChild(row);
        });
    }

    // P2P music sync — add to message handler
    // (handled in receive block below)

    // Volume slider
    const volSlider = document.getElementById('volume-slider');
    if (volSlider) {
        const savedVol = localStorage.getItem('gnoll_volume') ?? '0.3';
        volSlider.value = savedVol;
        setMusicVolume(savedVol);
        volSlider.addEventListener('input', e => setMusicVolume(e.target.value));
    }

    // Music button toggle
    document.getElementById('music-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        const panel = document.getElementById('music-panel');
        const open = panel.classList.toggle('open');
        if (open) updateTrackList();
    });
    document.getElementById('music-btn')?.addEventListener('mousedown', e => e.stopPropagation());
    document.getElementById('music-panel')?.addEventListener('mousedown', e => e.stopPropagation());

    // Close panel on outside click
    document.addEventListener('click', e => {
        if (!e.target.closest('#music-btn') && !e.target.closest('#music-panel')) {
            document.getElementById('music-panel')?.classList.remove('open');
        }
    });

    // Show music button for host (also handled in updatePeerUI)
    // Volume bar always visible — already in HTML

    // ═══════════════════════════════════════════════════════════════════════════
    // WEATHER EFFECTS
    // ═══════════════════════════════════════════════════════════════════════════
    const weatherCanvas = document.getElementById('weather-canvas');
    const weatherCtx    = weatherCanvas.getContext('2d');
    let   weatherRAF    = null;
    let   weatherActive = new Set();

    function resizeWeatherCanvas() {
        weatherCanvas.width  = window.innerWidth;
        weatherCanvas.height = window.innerHeight;
    }
    resizeWeatherCanvas();
    window.addEventListener('resize', resizeWeatherCanvas);

    const WEATHER_DEFS = {
        rain:      { label: '🌧 Rain',      color: 'rgba(180,200,255,', count: 300 },
        snow:      { label: '❄ Snow',       color: 'rgba(220,240,255,', count: 150 },
        embers:    { label: '🔥 Embers',    color: 'rgba(255,140,20,',  count: 80  },
        leaves:    { label: '🍂 Leaves',    color: 'rgba(180,100,30,',  count: 60  },
        fireflies: { label: '✨ Fireflies', color: 'rgba(200,255,100,', count: 40  },
        fog:       { label: '🌫 Fog',       color: 'rgba(220,225,235,', count: 18  },
    };

    const weatherParticles = {};

    function spawnParticle(type, W, H) {
        const p = { type };
        if (type === 'rain') {
            p.x = Math.random() * W; p.y = Math.random() * H;
            p.vx = -1.5; p.vy = 14 + Math.random() * 8;
            p.len = 12 + Math.random() * 10; p.op = 0.3 + Math.random() * 0.4;
        } else if (type === 'snow') {
            p.x = Math.random() * W; p.y = Math.random() * H;
            p.vx = (Math.random() - 0.5) * 0.6; p.vy = 0.8 + Math.random() * 1.4;
            p.r = 2 + Math.random() * 3; p.op = 0.5 + Math.random() * 0.5;
            p.wobble = Math.random() * Math.PI * 2; p.wobbleSpeed = 0.02 + Math.random() * 0.02;
        } else if (type === 'embers') {
            p.x = Math.random() * W; p.y = H + 10;
            p.vx = (Math.random() - 0.5) * 1.5; p.vy = -(1.5 + Math.random() * 2.5);
            p.r = 1 + Math.random() * 2; p.op = 0.6 + Math.random() * 0.4;
            p.life = 1.0; p.decay = 0.003 + Math.random() * 0.005;
        } else if (type === 'leaves') {
            p.x = Math.random() * W; p.y = -10;
            p.vx = -1 + Math.random() * 2; p.vy = 1 + Math.random() * 1.5;
            p.rot = Math.random() * Math.PI * 2; p.rotSpeed = (Math.random() - 0.5) * 0.08;
            p.size = 6 + Math.random() * 8; p.op = 0.6 + Math.random() * 0.4;
        } else if (type === 'fireflies') {
            p.x = Math.random() * W; p.y = Math.random() * H;
            p.vx = (Math.random() - 0.5) * 0.5; p.vy = (Math.random() - 0.5) * 0.5;
            p.r = 2 + Math.random() * 2; p.phase = Math.random() * Math.PI * 2;
            p.phaseSpeed = 0.03 + Math.random() * 0.04;
        } else if (type === 'fog') {
            p.x = Math.random() * W; p.y = Math.random() * H;
            p.vx = (Math.random() - 0.5) * 0.3; p.vy = (Math.random() - 0.5) * 0.15;
            p.r = 80 + Math.random() * 120; p.phase = Math.random() * Math.PI * 2;
            p.phaseSpeed = 0.004 + Math.random() * 0.004;
        }
        return p;
    }

    function initParticles(type) {
        const W = weatherCanvas.width, H = weatherCanvas.height;
        const count = WEATHER_DEFS[type].count;
        weatherParticles[type] = Array.from({ length: count }, () => spawnParticle(type, W, H));
    }

    function tickWeather() {
        const W = weatherCanvas.width, H = weatherCanvas.height;
        weatherCtx.clearRect(0, 0, W, H);

        for (const type of weatherActive) {
            const ps = weatherParticles[type] || [];
            ps.forEach((p, i) => {
                if (type === 'rain') {
                    weatherCtx.strokeStyle = WEATHER_DEFS.rain.color + p.op + ')';
                    weatherCtx.lineWidth = 1;
                    weatherCtx.beginPath();
                    weatherCtx.moveTo(p.x, p.y);
                    weatherCtx.lineTo(p.x + p.vx * p.len / p.vy, p.y + p.len);
                    weatherCtx.stroke();
                    p.x += p.vx; p.y += p.vy;
                    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
                    if (p.x < -20)    { p.x = W + 20; }

                } else if (type === 'snow') {
                    p.wobble += p.wobbleSpeed;
                    const grad = weatherCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
                    grad.addColorStop(0, WEATHER_DEFS.snow.color + p.op + ')');
                    grad.addColorStop(1, WEATHER_DEFS.snow.color + '0)');
                    weatherCtx.fillStyle = grad;
                    weatherCtx.beginPath(); weatherCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); weatherCtx.fill();
                    p.x += p.vx + Math.sin(p.wobble) * 0.4; p.y += p.vy;
                    if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }

                } else if (type === 'embers') {
                    p.life -= p.decay;
                    if (p.life <= 0) { weatherParticles[type][i] = spawnParticle('embers', W, H); return; }
                    weatherCtx.fillStyle = WEATHER_DEFS.embers.color + (p.op * p.life) + ')';
                    weatherCtx.beginPath(); weatherCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); weatherCtx.fill();
                    p.x += p.vx; p.y += p.vy;
                    p.vx += (Math.random() - 0.5) * 0.1;

                } else if (type === 'leaves') {
                    p.rot += p.rotSpeed;
                    weatherCtx.save(); weatherCtx.translate(p.x, p.y); weatherCtx.rotate(p.rot);
                    weatherCtx.fillStyle = WEATHER_DEFS.leaves.color + p.op + ')';
                    weatherCtx.beginPath();
                    weatherCtx.ellipse(0, 0, p.size * 0.5, p.size, 0, 0, Math.PI * 2);
                    weatherCtx.fill(); weatherCtx.restore();
                    p.x += p.vx + Math.sin(p.rot) * 0.5; p.y += p.vy;
                    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }

                } else if (type === 'fireflies') {
                    p.phase += p.phaseSpeed;
                    const glow = (Math.sin(p.phase) + 1) / 2;
                    const grad = weatherCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
                    grad.addColorStop(0, WEATHER_DEFS.fireflies.color + (0.9 * glow) + ')');
                    grad.addColorStop(1, WEATHER_DEFS.fireflies.color + '0)');
                    weatherCtx.fillStyle = grad;
                    weatherCtx.beginPath(); weatherCtx.arc(p.x, p.y, p.r * 3, 0, Math.PI*2); weatherCtx.fill();
                    p.x += p.vx + (Math.random() - 0.5) * 0.3;
                    p.y += p.vy + (Math.random() - 0.5) * 0.3;
                    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
                    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

                } else if (type === 'fog') {
                    p.phase += p.phaseSpeed;
                    const op = (Math.sin(p.phase) * 0.025 + 0.045);
                    const grad = weatherCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
                    grad.addColorStop(0, WEATHER_DEFS.fog.color + op + ')');
                    grad.addColorStop(1, WEATHER_DEFS.fog.color + '0)');
                    weatherCtx.fillStyle = grad;
                    weatherCtx.beginPath(); weatherCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); weatherCtx.fill();
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < -p.r) p.x = W + p.r; if (p.x > W + p.r) p.x = -p.r;
                    if (p.y < -p.r) p.y = H + p.r; if (p.y > H + p.r) p.y = -p.r;
                }
            });
        }

        if (weatherActive.size > 0) weatherRAF = requestAnimationFrame(tickWeather);
        else { weatherRAF = null; weatherCtx.clearRect(0, 0, W, H); }
    }

    function setWeatherEffect(type, on) {
        if (on) {
            weatherActive.add(type);
            if (!weatherParticles[type]) initParticles(type);
            if (!weatherRAF) weatherRAF = requestAnimationFrame(tickWeather);
        } else {
            weatherActive.delete(type);
        }
        // Update button appearance
        const btn = document.querySelector(`[data-weather="${type}"]`);
        if (btn) {
            btn.style.background = on ? 'rgba(200,168,60,0.25)' : 'rgba(255,255,255,0.07)';
            btn.style.borderColor = on ? 'rgba(200,168,60,0.7)' : 'rgba(255,255,255,0.15)';
            btn.style.color = on ? '#e8d080' : '#bbb';
        }
        broadcast({ type: 'weather_update', effects: [...weatherActive] });
    }

    // Build weather panel buttons
    const weatherBtnsEl = document.getElementById('weather-btns');
    Object.entries(WEATHER_DEFS).forEach(([type, def]) => {
        const btn = document.createElement('button');
        btn.dataset.weather = type;
        btn.textContent = def.label;
        btn.style.cssText = 'padding:5px 8px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:5px;color:#bbb;font-family:var(--font-serif);font-size:12px;cursor:pointer;text-align:center;transition:all 0.15s;';
        btn.addEventListener('click', e => { e.stopPropagation(); setWeatherEffect(type, !weatherActive.has(type)); });
        weatherBtnsEl.appendChild(btn);
    });

    // Weather panel toggle
    document.getElementById('btn-weather')?.addEventListener('click', e => {
        e.stopPropagation();
        const panel = document.getElementById('weather-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', e => {
        if (!e.target.closest('#weather-panel') && !e.target.closest('#btn-weather'))
            document.getElementById('weather-panel').style.display = 'none';
    });

    // P2P receive
    // (handled in message switch below)
    // Fix 3: debounced light_sync — coalesces rapid drops into one broadcast with token id
    let lightSyncTimer = null;
    let lightSyncTokenId = null;
    function scheduleLightSync(tokenId) {
        // If a different token triggers a sync before the timer fires, do a full redraw
        if (lightSyncTokenId !== null && lightSyncTokenId !== tokenId) lightSyncTokenId = null;
        else lightSyncTokenId = tokenId;
        clearTimeout(lightSyncTimer);
        lightSyncTimer = setTimeout(() => {
            broadcast({ type: 'light_sync', tokenId: lightSyncTokenId });
            lightSyncTimer = null; lightSyncTokenId = null;
        }, 150); // 150ms debounce — coalesces multi-token group moves
    }
    function createBloodDrip(W, H, fromTop = false) {
        return {
            x: 8 + Math.random() * (W - 16),
            y: fromTop ? -(4 + Math.random() * 20) : Math.random() * H,
            vy: 0.15 + Math.random() * 0.35,
            r: 4 + Math.random() * 9,
            op: 0.45 + Math.random() * 0.45,
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: 0.012 + Math.random() * 0.02,
        };
    }

    function addBloodEffect(token) {
        if (token.bloodRAF) return;
        const { w, h } = getObjSize(token);
        const cW = w, cH = h; // no overflow — stays within token bounds
        const canvas = document.createElement('canvas');
        canvas.width = cW; canvas.height = cH;
        canvas.style.cssText = `position:absolute;left:${Math.round(token.x - w/2 + FOG_OFFSET)}px;top:${Math.round(token.y - h/2 + FOG_OFFSET)}px;pointer-events:none;z-index:201;border-radius:50%;`;
        tokensContainer.appendChild(canvas);
        token.bloodCanvas = canvas;
        const ctx   = canvas.getContext('2d');
        const r     = Math.min(cW, cH) / 2;
        const drips = Array.from({ length: 14 }, () => createBloodDrip(cW, cH));
        function tick() {
            ctx.clearRect(0, 0, cW, cH);
            // Clip all drawing to the circular token boundary
            ctx.save();
            ctx.beginPath();
            ctx.arc(cW / 2, cH / 2, r, 0, Math.PI * 2);
            ctx.clip();
            drips.forEach((d, i) => {
                const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
                grad.addColorStop(0,    `rgba(155,0,12,${d.op})`);
                grad.addColorStop(0.55, `rgba(110,0,8,${d.op * 0.5})`);
                grad.addColorStop(1,    'rgba(70,0,5,0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
                d.y += d.vy; d.x += Math.sin(d.wobble) * 0.22; d.wobble += d.wobbleSpeed;
                if (d.y > cH + d.r) drips[i] = createBloodDrip(cW, cH, true);
            });
            ctx.restore();
            token.bloodRAF = requestAnimationFrame(tick);
        }
        token.bloodRAF = requestAnimationFrame(tick);
    }

    function removeBloodEffect(token) {
        if (token.bloodRAF) { cancelAnimationFrame(token.bloodRAF); token.bloodRAF = null; }
        token.bloodCanvas?.remove(); token.bloodCanvas = null;
    }

    function updateBloodCanvas(token) {
        if (!token.bloodCanvas) return;
        const { w, h } = getObjSize(token);
        token.bloodCanvas.style.left = Math.round(token.x - w/2 + FOG_OFFSET) + 'px';
        token.bloodCanvas.style.top  = Math.round(token.y - h/2 + FOG_OFFSET) + 'px';
    }

    let darkMode = localStorage.getItem('gnoll_dark_mode') === 'true';

    function applyDarkMode(enabled, fromPeer = false) {
        darkMode = enabled;
        document.body.classList.toggle('dark-mode', enabled);
        const btn = document.getElementById('btn-dark-mode');
        if (btn) { btn.textContent = enabled ? '☀ Light' : '🕯 Dark'; }
        localStorage.setItem('gnoll_dark_mode', enabled);
        if (!fromPeer) broadcast({ type: 'dark_mode', enabled });
    }

    document.getElementById('btn-dark-mode')?.addEventListener('click', () => {
        applyDarkMode(!darkMode);
    });

    // Apply saved preference on load
    if (darkMode) applyDarkMode(true, true);

    // ═══════════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════════
    zoom = 1.3;
    panX = window.innerWidth/2 - 2500*zoom;
    panY = window.innerHeight/2 - 2500*zoom;
    updateTransform();
    renderNoteTabs();
    requestAnimationFrame(() => {
        initNoteToolbar();
    });
    initApp();
    </script>
